name: Build and Deploy
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 1 1 *'
  repository_dispatch:
    types: [build-and-deploy]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: 'latest'

      - name: Build
        run: hugo --minify

      - name: Copy CNAME and robots.txt
        run: cp CNAME robots.txt public

      # Deploy site
      - name: Create Deploy Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: create-deploy-token
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ steps.create-deploy-token.outputs.token }}
          git-config-email: ${{ secrets.GIT_CONFIG_EMAIL }}
          git-config-name: ${{ secrets.GIT_CONFIG_NAME }}
          branch: github-pages
          folder: public
          repository-name: michael-valdron/michael-valdron.github.io
          clean: true
